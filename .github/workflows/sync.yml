name: Sync from DGWEB

on:
  schedule:
    # UTC 21:00 = 北京时间 05:00（DGWEB 04:30 构建之后）
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dgweb
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest data from DGWEB
        run: |
          curl -fsSL -o latest.json https://raw.githubusercontent.com/ccakenice/DGWEB/main/latest.json
          curl -fsSL -o modes.json https://raw.githubusercontent.com/ccakenice/DGWEB/main/modes.json

      - name: Validate JSON
        run: |
          python -c "import json; json.load(open('latest.json', encoding='utf-8')); json.load(open('modes.json', encoding='utf-8')); print('JSON valid')"

      - name: Check for changes
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json modes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git commit -m "chore: sync data from DGWEB ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
